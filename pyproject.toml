[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecommerce-support-capstone"
version = "0.1.0"
description = "MVP academico de roteamento hibrido para suporte de e-commerce"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*"]

